<!DOCTYPE html>
<html>
   <head>
      <meta charset="UTF-8">
      <link rel="stylesheet" href="estilo.css">
   </head>

   <body>
      <div><button id="botaoCarregar">Carregando cervejas...</button></div>
      <table id="meu amor" class="tabela-cervejas">
         <tbody></tbody>
      </table>
      <div><button id="botaoOrdenar">Ordenar</button></div>
   </body>

   <script>
      let cervejas = ["Guiness", "Desperados", "Becks"]
      let sorvetes = ["Creme", "Morango", "Chocolate"]

      const carregarDiv = (cervs) => {
         const tabela = document.querySelector("#meu\\ amor tbody")
         const cervejasHtml = cervs.map(item => `<tr><td>${item}</td></tr>`)
         tabela.innerHTML = cervejasHtml.join("\n")
      }
      let botao = document.getElementById("botaoCarregar")
      botao.addEventListener("click", () => carregarDiv(sorvetes))
      let botao2 = document.getElementById("botaoOrdenar")
      botao2.addEventListener("click", () => carregarDiv(sorvetes.sort()))
   </script>
</html>
