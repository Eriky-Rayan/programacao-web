<!DOCTYPE html>
<html>
   <head>
      <title>ReceitaReact - 2</title>
   </head>
   <body>
      <div id="app">

      </div>

      <script src="libs/react.js"></script>
      <script src="libs/react-dom.js"></script>
      <script src="libs/babel.js"></script>

      <script type="text/babel">

         class ImagemPinga extends React.Component{
            render(){
               return (
                  <img
                     src="https://mambodelivery.vtexassets.com/arquivos/ids/159833/cachaca-51-965ml.jpg?v=637883136200030000"
                     width="300"
                     height="300"
                  />
               )
            }
         }

         class TabelaBebidas extends React.Component{

            render(){
               return (
                  <div>
                     <table id="tabela" border="1">
                        <thead>
                           <tr><th>Nome</th><th>Marca</th></tr>
                        </thead>
                        <tbody>
                           <tr><td>Havana</td><td>Engenho Anísio Santiago</td></tr>
                        </tbody>
                     </table>
                 </div>
               )
            }

         }


         const TabelaBebidas__ = () => {
            return (
               <div>
                  <h1>Tabela de Bebidas</h1>
                  <table id="tabela" border="1">
                     <thead>
                        <tr><th>Nome</th><th>Marca</th></tr>
                     </thead>
                     <tbody>
                        <tr><td>Havana</td><td>Engenho Anísio Santiago</td></tr>
                     </tbody>
                  </table>
               </div>
            )
         }

         ReactDOM.render(
            <div>
               <TabelaBebidas/>
               <ImagemPinga/>
            </div>
            ,
            document.getElementById("app"))

      </script>
   </body>
</html>
