<!DOCTYPE html>
<html>
   <head>
      <meta charset="UTF-8">
   </head>

   <body>
      <div><button id="botaoCarregar">Carregando cervejas...</button></div>
      <div id="cervejasDiv"></div>
      <br/>
      <table id="cervejasTabela" border="1" hidden>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Cerveja</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
   </body>

   <script>

      let cervejas = [
         {
            name: "Guiness",
            alcohol: "10%"
         },
         {
            name: "Desperados",
            alcohol: "6%"
         },
         {
            name: "Becks",
            alcohol: "5%"
         }
      ]

      //cs é um array de cervejas
      const carregarDiv = cs => {
          const div = document.getElementById("tableBody")
          const itensHtml = cs.map(item => `
            <tr>
               <td>${item.name}</td>
               <td>${item.alcohol}</td>
            </tr>
          `)
         div.innerHTML = `${itensHtml.join("\n")}`
         document.getElementById("cervejasTabela").hidden = false
      }

      let botao = document.getElementById("botaoCarregar")
      botao.addEventListener("click", () => carregarDiv(cervejas) )

   </script>
</html>
