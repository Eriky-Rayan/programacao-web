<!DOCTYPE html>
<html>
   <head>
      <meta charset="UTF-8">
      <link rel="stylesheet" href="estilo.css">
   </head>

   <body>
      <div><button id="botaoCarregar">Carregando cervejas...</button></div>
      <div id="cervejasDiv"></div>
      <br/>
      <table id="cervejasTabela" hidden>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Álcool</th>
                <th>Estilo</th>
                <th>Ibu</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
   </body>

   <script>

      let cervejas = [
         {
            name: "Guiness",
            alcohol: "10%",
            style: "Red Ale",
            ibu: "15"
         },
         {
            name: "Desperados",
            alcohol: "6%",
            style: "English IPA",  
            ibu: "34"
         },
         {
            name: "Becks",
            alcohol: "5%",
            style: "Cream Ale", 
            ibu: "45"
         }
      ]

      //cs é um array de cervejas
      const carregarDiv = (cs, id = "cervejasDiv") => {
          const div = document.getElementById(id)
          const itensHtml = cs.map(item => `
            <tr>
               <td>${item.name}</td>
               <td>${item.alcohol}</td>
               <td>${item.style}</td>
               <td>${item.ibu}</td>
            </tr>
          `)
         div.innerHTML = `${itensHtml.join("\n")}`
         document.getElementById("cervejasTabela").hidden = false
      }

      let botao = document.getElementById("botaoCarregar")
      botao.addEventListener("click", () => carregarDiv(cervejas, "tableBody"))

   </script>
</html>
