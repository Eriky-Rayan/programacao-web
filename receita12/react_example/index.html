<!DOCTYPE html>

<html>

   <head>

      <title>ReceitaReact - 3</title>

   </head>

   <body>

      <div id="app">

      </div>
      <script src="libs/react.js"></script>

      <script src="libs/react-dom.js"></script>

      <script src="libs/babel.js"></script>



      <script type="text/babel">
         const TabelaBebidas = ({ titulo, cabecalhos, conteudo }) => {
            return (
               <div>
                  <h1>{titulo}</h1>
                  <table id="tabela" border="1">
                     <thead>
                        <tr>
                           {cabecalhos.map((cabecalho, index) => (
                              <th key={index}>{cabecalho}</th>
                           ))}
                        </tr>
                     </thead>
                     <tbody>
                        {conteudo.map((linha, indexLinha) => (
                           <tr key={indexLinha}>
                              {(Array.isArray(linha) ? linha : Object.values(linha)).map((celula, indexColuna) => (
                                 <td key={indexColuna}>{celula}</td>
                              ))}
                           </tr>
                        ))}
                     </tbody>
                  </table>
               </div>
            );
         };

         const valoresCabecalhos = ["Nome", "Marca"];
         const dadosTabela = [
            ["Havana", "Engenho Anísio Santiago"],
            ["Ypióca", "Ypióca Agroindustrial"],
            ["51", "Cia. Müller de Bebidas"]
         ];

         ReactDOM.render(
            <TabelaBebidas
               titulo="minha tabela de cana"
               cabecalhos={valoresCabecalhos}
               conteudo={dadosTabela}
            />,
            document.getElementById("app")
         );
      </script>
   </body>
</html>
