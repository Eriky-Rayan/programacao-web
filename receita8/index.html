<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Telefones</title>
    <link rel="stylesheet" href="estilo.css">
  </head>

  <body>
    <h1>🍹 Buscador de Telefones</h1>

    <div><button id="botaoCarregar">Carregando telefones...</button></div>
    <div id="cervejasDiv"></div>
  </body>

  <script>
    let cervejas = []

    // cs é um array de cervejas
    const carregarDiv = cs => {
      const div = document.getElementById("cervejasDiv")
      const itensHtml = cs.map(({ id, title, price }) =>
        `<div>${id} <span class="categoria">${title}</span> <span class="preco">R$${price}</span></div>`
      )
      div.innerHTML = `${itensHtml.join("\n")}`
    }

    /*
    async function carregarCervejas() {
      try {
        let res = await fetch("https://dummyjson.com/products/search?q=drinks")
        data = await res.json()
        cervejas = data.products
        carregarDiv(cervejas)
      } catch (err) {
        document.getElementById("cervejasDiv").innerHTML = `<p class="vazio">Fudeu...</p>`
      }
    }*/

    function carregarCervejas2() {
      fetch("https://dummyjson.com/products/search?q=phones").then(
        res => res.json()
      ).then(
        json => carregarDiv(json.products)
      ).catch(
        err => document.getElementById("cervejasDiv").innerHTML = `<p class="vazio">Fudeu... ${err}</p>`
      )
      document.getElementById("cervejasDiv").innerHTML = `<p class="vazio">Fazendo requisição</p>`
    }

    let botao = document.getElementById("botaoCarregar")
    botao.addEventListener("click", () => carregarCervejas2())
  </script>
</html>
